<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <!-- Metadados e importaÃ§Ã£o de recursos -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Painel - Sidebar</title>

  <!-- Bibliotecas e estilos externos -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="./css/style.css" rel="stylesheet">
</head>
<body>
  <!-- Estrutura principal da pÃ¡gina -->
  <div class="d-flex">
    <!-- Sidebar lateral -->
    <aside class="sidebar" id="sidebar" aria-label="Sidebar de navegação">
      <!-- Cabeçalho da sidebar -->
      <header class="top d-flex justify-content-between align-items-start p-3 pt-4">
        <div class="hide-c">
          <div class="brand">Grupo<span>||</span>AKRK</div>
          <div class="brand-sub">Gestão de Lançamentos</div>
        </div>
        <div class="brand d-none show-c">||</div>
        <button class="icon-btn hide-c" title="Notificações" aria-label="Notificações">
          <i class="bi bi-bell"></i>
        </button>
      </header>

      <!-- Navegação principal -->
      <nav class="flex-grow-1 overflow-auto px-2" aria-label="Menu principal">
        <h2 class="section-label">Visão geral</h2>
        <button class="nav-item-btn active" title="Início" aria-label="Início">
          <i class="bi bi-house"></i>
          <span class="hide-c">Início</span>
        </button>

        <h2 class="section-label">Módulos</h2>

        <!-- Grupo de lançamentos com submenu -->
        <button class="nav-item-btn" data-bs-toggle="collapse" data-bs-target="#m1" aria-expanded="false" title="Lançamentos" aria-label="Lançamentos">
          <i class="bi bi-credit-card c-pink"></i>
          <span class="hide-c">Lançamentos</span>
          <i class="bi bi-chevron-down chev hide-c"></i>
        </button>
        <div class="collapse" id="m1">
          <ul class="submenu my-1">
            <li><a href="#">Lembrete</a></li>
            <li><a href="#">História datas de corte</a></li>
          </ul>
        </div>

        <!-- Grupo de dashboard com submenu -->
        <button class="nav-item-btn" data-bs-toggle="collapse" data-bs-target="#m2" aria-expanded="false" title="Portfólio" aria-label="Dashboard">
          <i class="bi bi-graph-up c-green"></i>
          <span class="hide-c">Dashboard</span>
          <i class="bi bi-chevron-down chev hide-c"></i>
        </button>
        <div class="collapse" id="m2">
          <ul class="submenu my-1">
            <li><a href="#">Clientes</a></li>
            <li><a href="#">Relatórios</a></li>
          </ul>
        </div>
      </nav>

      <!-- Botão para recolher/expandir o menu -->
      <div class="px-2 pb-2">
        <button class="nav-item-btn" id="toggle" aria-label="Recolher menu">
          <i class="bi bi-layout-sidebar-inset"></i>
          <span class="hide-c">Recolher menu</span>
        </button>
      </div>

      <!-- Rodapé com perfil e ações do usuário -->
      <footer class="footer d-flex align-items-center gap-2 p-3" aria-label="Perfil do usuário">
        <div class="avatar">U</div>
        <div class="flex-grow-1 text-truncate hide-c">
          <div class="user-name text-truncate">Usuário</div>
          <div class="user-role text-truncate">Administrador</div>
        </div>
        <button class="icon-btn hide-c" title="Tema" aria-label="Tema"><i class="bi bi-sun"></i></button>
        <button class="icon-btn hide-c" title="Sair" aria-label="Sair"><i class="bi bi-box-arrow-right"></i></button>
      </footer>
    </aside>

    <!-- Conteúdo principal -->
    <main class="flex-grow-1 p-5" aria-label="Conteúdo principal">
      <h1 class="h3 fw-bold">Início</h1>
      <p class="text-secondary">Bem-vindo ao painel.</p>
    </main>
  </div>

  <!-- Scripts do Bootstrap e interação da sidebar -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="./js/script.js"></script>
</body>
</html>
