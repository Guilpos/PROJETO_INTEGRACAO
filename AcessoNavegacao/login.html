<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <!-- Metadados essenciais -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Grupo AKRK</title>

  <!-- Bibliotecas externas -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Estilos do projeto -->
  <link href="./css/login.css" rel="stylesheet">
</head>
<body>
  <!-- Estrutura principal da tela de login -->
  <main class="auth-screen">
    <section class="auth-panel" aria-label="Tela de login da aplicação">

      <!-- Composição visual exclusiva da tela de login -->
      <div class="auth-empty-panel" aria-hidden="true">
        <div class="visual-grid"></div>
        <div class="visual-orb visual-orb-one"></div>
        <div class="visual-orb visual-orb-two"></div>
        <div class="visual-content">
          <h1>Gestão simples.<br><span>Decisões claras.</span></h1>
          <p>Acesse o ambiente de lançamentos e validação de cartões e acompanhe as operações em tempo real.</p>
          <div class="visual-metrics">
            <div>
              <i class="bi bi-shield-check"></i>
              <span><strong>Seguro</strong><small>Acesso protegido</small></span>
            </div>
            <div>
              <i class="bi bi-lightning-charge"></i>
              <span><strong>Ágil</strong><small>Resultados rápidos</small></span>
            </div>
          </div>
        </div>
      </div>

      <!-- Marca e formulário reunidos no lado direito -->
      <section class="auth-form-panel">
        <div class="auth-content">
          <div class="brand-wrap">
            <div class="brand">Grupo<span>||</span>AKRK</div>
            <div class="brand-sub">Gestão de Lançamentos e Validação de Cartões</div>
          </div>

          <div class="login-card">
            <div class="login-top">
              <span class="status-dot"></span>
              <span>Área restrita</span>
            </div>

            <h2>Entrar</h2>

            <form class="login-form" id="loginForm">
              <div class="form-field">
                <label for="email">Usuário</label>
                <div class="field-wrap">
                  <i class="bi bi-person"></i>
                  <input id="email" name="email" type="email" placeholder="seu@email.com" autocomplete="username" required>
                </div>
              </div>

              <div class="form-field">
                <label for="password">Senha</label>
                <div class="field-wrap">
                  <i class="bi bi-lock"></i>
                  <input id="password" name="password" type="password" placeholder="••••••••" autocomplete="current-password" required>
                </div>
              </div>

              <div class="form-options">
                <label class="checkbox">
                  <input type="checkbox" id="remember" name="remember">
                  <span>Lembrar-me</span>
                </label>
              </div>

              <!-- Mensagem de erro dinâmica (oculta por padrão) -->
              <div id="loginError" class="alert alert-danger py-2 px-3 small d-none" role="alert"></div>

              <button type="submit" class="primary-btn" id="btnSubmit">Entrar</button>
            </form>
          </div>
        </div>
      </section>
    </section>
  </main>

  <!-- SDK do Supabase e Script de Autenticação -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./js/login.js"></script>
</body>
</html>
