<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calendário de Lançamentos</title>
    <link rel="stylesheet" href="css/estilo.css" />
  </head>
  <body>
    <div class="container-app">
      <!-- Topo -->
      <div class="topbar">
        <h1>Pendências de Hoje (<span id="data-hoje"></span>)</h1>
        <div
          style="
            display: flex;
            gap: 0.5rem;
            align-items: center;
            flex-wrap: wrap;
          "
        >
          <select id="seletor-competencia" title="Competência"></select>
          <button class="btn btn-primary" id="btn-nova-competencia">
            Nova competência
          </button>
          <input
            type="file"
            id="input-upload"
            accept=".xlsx,.xls,.csv"
            class="btn"
            hidden
          />
          <button class="btn" id="btn-upload">Importar planilha</button>
          <button class="btn" id="btn-baixar-planilha">Baixar planilha</button>
          <button class="btn" id="btn-novo-convenio">+ Convênio</button>
        </div>
      </div>

      <!-- Abas de pendências -->
      <div class="tabs" id="abas-pendencias">
        <div class="tab ativa" data-tab="lancamentos">
          🚀 Lançamentos de Hoje
        </div>
        <div class="tab" data-tab="cortes">✂️ Cortes de Hoje</div>
        <div class="tab" data-tab="periodo">⚠️ Em Período de Lançamento</div>
      </div>

      <!-- Aviso -->
      <div class="aviso-verde" id="aviso-pendencias"></div>

      <!-- Grade de pendências -->
      <div class="card-dark">
        <div style="max-height: 320px; overflow: auto">
          <table class="tabela-dark" id="tabela-pendencias">
            <thead>
              <tr>
                <th>Convênio</th>
                <th>Data de Corte</th>
                <th>Data de Lançamento</th>
                <th>Responsável</th>
                <th>Validação</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>

      <!-- Alertas -->
      <div class="card-dark" id="card-alertas">
        <div
          style="
            display: flex;
            align-items: center;
            justify-content: space-between;
          "
        >
          <strong id="titulo-alertas">🔔 Alertas (0)</strong>
          <button class="btn" id="btn-toggle-alertas" style="font-size: 0.8rem">
            Mostrar
          </button>
        </div>
        <div id="lista-alertas" style="display: none; margin-top: 0.5rem"></div>
      </div>

      <!-- Base da competência -->
      <div class="card-dark">
        <div
          style="
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 0.5rem;
          "
        >
          <h2 style="font-size: 1.1rem; margin: 0">
            Base de Lançamentos — <span id="label-competencia"></span>
          </h2>
          <input
            type="text"
            id="busca-base"
            placeholder="Buscar convênio..."
            style="min-width: 240px"
          />
        </div>
        <select id="filtro-campo-base">
          <option value="todos">Todos os campos</option>
          <option value="convenio_nome">Convênio</option>
          <option value="sistema">Sistema</option>
          <option value="lancador_nome">Lançador (Responsável)</option>
          <option value="validador_nome">Validador</option>
          <option value="data_de_corte">Data de Corte</option>
          <option value="data_de_lancamento">Data de Lançamento</option>
        </select>
        <div style="max-height: 60vh; overflow: auto">
          <table class="tabela-dark" id="tabela-base">
            <thead>
              <tr>
                <th
                  data-sort="convenio_nome"
                  data-label="Convênio"
                  style="cursor: pointer"
                >
                  Convênio
                </th>
                <th
                  data-sort="sistema"
                  data-label="Sistema"
                  style="cursor: pointer"
                >
                  Sistema
                </th>
                <th
                  data-sort="data_de_corte"
                  data-label="Data de Corte"
                  style="cursor: pointer"
                >
                  Data de Corte
                </th>
                <th
                  data-sort="data_de_lancamento"
                  data-label="Data de Lançamento"
                  style="cursor: pointer"
                >
                  Data de Lançamento
                </th>
                <th
                  data-sort="lancador_nome"
                  data-label="Lançador (Responsável)"
                  style="cursor: pointer"
                >
                  Lançador (Responsável)
                </th>
                <th
                  data-sort="validador_nome"
                  data-label="Validador"
                  style="cursor: pointer"
                >
                  Validador
                </th>
                <th></th>
                <!-- coluna do botão excluir -->
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- ============================================================
     VERSÃO REAL (Supabase)
     Ordem dos scripts:
       1. supabase-js (cliente Supabase, baixado)
       2. supabase.js  (client + helpers de data)
       3. auth.js      (sessão via token # do app do colega)
       4. calendario.js(lógica de negócio)
       5. xlsx         (SheetJS, baixado, para upload/download)
       6. upload.js    (leitura de planilha)
       7. app.js       (orquestração)
     ============================================================ -->
    <script src="js/supabase-js.js"></script>
    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/calendario.js"></script>
    <script src="js/xlsx.full.min.js"></script>
    <script src="js/upload.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
